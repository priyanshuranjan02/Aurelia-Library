spring.application.name=library-management-system
spring.datasource.url=${LMS_DB_URL:jdbc:mysql://localhost:3306/librarydb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${LMS_DB_USERNAME:root}
# Credentials must be supplied by the environment; do not commit usable passwords.
spring.datasource.password=${LMS_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Keep Instant audit fields mapped compatibly with Hibernate/MySQL DATETIME(6).
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jackson.default-property-inclusion=non_null
server.error.include-message=never

# Existing non-empty installations are baselined at V1; Hibernate validation then checks
# that the mapped tables/columns are compatible. Empty databases execute V1 normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Bootstrap an initial administrator only when both values are explicitly configured.
lms.bootstrap-admin.username=${LMS_BOOTSTRAP_ADMIN_USERNAME:}
lms.bootstrap-admin.password=${LMS_BOOTSTRAP_ADMIN_PASSWORD:}

# Keep logs useful without tracing security internals or dumping verbose web diagnostics.
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
