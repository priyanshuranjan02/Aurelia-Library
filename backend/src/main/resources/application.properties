server.port=${PORT:8080}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}
server.servlet.session.cookie.secure=${SERVER_SERVLET_SESSION_COOKIE_SECURE:false}

spring.application.name=library-management-system
spring.datasource.url=${LMS_DB_URL:jdbc:mysql://localhost:3306/librarydb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${LMS_DB_USERNAME:root}
# Credentials must be supplied by the environment; do not commit usable passwords.
spring.datasource.password=${LMS_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Keep Instant audit fields mapped compatibly with Hibernate/MySQL DATETIME(6).
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jackson.default-property-inclusion=non_null
server.error.include-message=never

# Existing non-empty installations are baselined at V1; Hibernate validation then checks
# that the mapped tables/columns are compatible. Empty databases execute migrations normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Bootstrap an initial administrator only when both values are explicitly configured.
lms.bootstrap-admin.username=${LMS_BOOTSTRAP_ADMIN_USERNAME:}
lms.bootstrap-admin.password=${LMS_BOOTSTRAP_ADMIN_PASSWORD:}

# Local development can continue to use SMTP. Render Free should use the Brevo HTTPS API,
# because Render Free web services block outbound SMTP ports 25, 465, and 587.
spring.mail.host=${LMS_SMTP_HOST:}
spring.mail.port=${LMS_SMTP_PORT:587}
spring.mail.username=${LMS_SMTP_USERNAME:}
spring.mail.password=${LMS_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${LMS_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${LMS_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${LMS_SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${LMS_SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${LMS_SMTP_WRITE_TIMEOUT:10000}
lms.mail.provider=${LMS_EMAIL_PROVIDER:smtp}
lms.mail.api-key=${LMS_EMAIL_API_KEY:}
lms.mail.api-url=${LMS_EMAIL_API_URL:https://api.brevo.com/v3/smtp/email}
lms.mail.from=${LMS_MAIL_FROM:}
lms.mail.from-name=${LMS_MAIL_FROM_NAME:Aurelia Library}
lms.invitation.base-url=${LMS_PUBLIC_BASE_URL:http://localhost:8080}
lms.invitation.expiry-hours=${LMS_INVITATION_EXPIRY_HOURS:24}

# Keep logs useful without tracing security internals or dumping verbose web diagnostics.
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
